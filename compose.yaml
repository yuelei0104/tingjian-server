services:
  mysql:
    image: mysql:8.4
    container_name: tingjian-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tingjian
      MYSQL_USER: tingjian
      MYSQL_PASSWORD: ${TINGJIAN_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TINGJIAN_DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - tingjian_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: tingjian-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - tingjian_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tingjian-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      usage-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TINGJIAN_SERVER_PORT: 8080
      TINGJIAN_DB_URL: jdbc:mysql://mysql:3306/tingjian?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai
      TINGJIAN_DB_USERNAME: tingjian
      TINGJIAN_DB_PASSWORD: ${TINGJIAN_DB_PASSWORD}
      TINGJIAN_REDIS_HOST: redis
      TINGJIAN_REDIS_PORT: 6379
      TINGJIAN_VERIFICATION_PEPPER: ${TINGJIAN_VERIFICATION_PEPPER}
      TINGJIAN_VERIFICATION_WEBHOOK_URL: ${TINGJIAN_VERIFICATION_WEBHOOK_URL}
      TINGJIAN_VERIFICATION_WEBHOOK_TOKEN: ${TINGJIAN_VERIFICATION_WEBHOOK_TOKEN:-}
      TINGJIAN_CORS_ALLOWED_ORIGINS: ${TINGJIAN_CORS_ALLOWED_ORIGINS:-http://localhost:*}
      TINGJIAN_USAGE_SERVICE_ENABLED: "true"
      TINGJIAN_USAGE_SERVICE_URL: http://usage-service:8093
      TINGJIAN_USAGE_FAIL_OPEN: ${TINGJIAN_USAGE_FAIL_OPEN:-true}
      TINGJIAN_INTERNAL_SERVICE_TOKEN: ${TINGJIAN_INTERNAL_SERVICE_TOKEN:?TINGJIAN_INTERNAL_SERVICE_TOKEN is required}
    ports:
      - "8080:8080"

  usage-service:
    build:
      context: .
      dockerfile: microservices/Dockerfile
      args:
        SERVICE: usage-service
    container_name: tingjian-usage-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TINGJIAN_USAGE_BIND_ADDRESS: 0.0.0.0
      TINGJIAN_USAGE_DB_URL: jdbc:mysql://mysql:3306/tingjian?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai
      TINGJIAN_USAGE_DB_USERNAME: tingjian
      TINGJIAN_USAGE_DB_PASSWORD: ${TINGJIAN_DB_PASSWORD}
      TINGJIAN_USAGE_REDIS_HOST: redis
      TINGJIAN_USAGE_REDIS_PORT: 6379
      TINGJIAN_INTERNAL_AUTH_ENABLED: "true"
      TINGJIAN_INTERNAL_SERVICE_TOKEN: ${TINGJIAN_INTERNAL_SERVICE_TOKEN:?TINGJIAN_INTERNAL_SERVICE_TOKEN is required}
    expose:
      - "8093"

  ai-speech-service:
    build:
      context: .
      dockerfile: microservices/Dockerfile
      args:
        SERVICE: ai-speech-service
    container_name: tingjian-ai-speech-service
    restart: unless-stopped
    environment:
      TINGJIAN_AI_SPEECH_BIND_ADDRESS: 0.0.0.0
      TINGJIAN_INTERNAL_AUTH_ENABLED: "true"
      TINGJIAN_INTERNAL_SERVICE_TOKEN: ${TINGJIAN_INTERNAL_SERVICE_TOKEN:?TINGJIAN_INTERNAL_SERVICE_TOKEN is required}
      TINGJIAN_QWEN_API_KEY: ${TINGJIAN_QWEN_API_KEY:-}
      TINGJIAN_ASR_API_KEY: ${TINGJIAN_ASR_API_KEY:-}
    expose:
      - "8092"

  gateway-service:
    build:
      context: .
      dockerfile: microservices/Dockerfile
      args:
        SERVICE: gateway-service
    container_name: tingjian-gateway
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      TINGJIAN_LEGACY_HTTP_URL: http://server:8080
      TINGJIAN_LEGACY_WS_URL: ws://server:8080
    ports:
      - "8088:8088"

volumes:
  tingjian_mysql_data:
  tingjian_redis_data:
