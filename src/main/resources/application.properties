spring.application.name=Tingjian-Server

server.port=8080
server.shutdown=graceful
server.tomcat.connection-timeout=10s
spring.lifecycle.timeout-per-shutdown-phase=20s

# MySQL database configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:13306/tingjian?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai
spring.datasource.username=tingjian
spring.datasource.password=${TINGJIAN_DB_PASSWORD}

# Flyway owns schema initialization. Existing databases are baselined at version 0,
# then the idempotent V1 migration fills in any missing tables.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Redis cache configuration
spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379
spring.data.redis.database=0
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# Authentication security. Replace the pepper through an environment variable in production.
tingjian.auth.verification-pepper=${TINGJIAN_VERIFICATION_PEPPER:change-this-development-pepper}
tingjian.auth.verification-valid-minutes=10
tingjian.auth.verification-delivery=log
# For real email/SMS delivery set mode to webhook and configure these environment variables.
tingjian.auth.verification-webhook-url=${TINGJIAN_VERIFICATION_WEBHOOK_URL:http://127.0.0.1:18081/verification/send}
tingjian.auth.verification-webhook-token=${TINGJIAN_VERIFICATION_WEBHOOK_TOKEN:}
tingjian.auth.login-max-failures=5
tingjian.auth.login-max-ip-failures=25
tingjian.auth.login-window-minutes=15
tingjian.auth.code-cooldown-seconds=60
tingjian.auth.code-max-requests-per-ip=30

# Browser/WebSocket origins only. Native Android requests do not send an Origin header.
tingjian.cors.allowed-origin-patterns=${TINGJIAN_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [requestId:%X{requestId:-none}]

# AI expression provider. Keep local until DASHSCOPE_API_KEY and the provider are enabled.
tingjian.ai.provider=${TINGJIAN_AI_PROVIDER:local}
tingjian.ai.qwen.api-key=${DASHSCOPE_API_KEY:}
tingjian.ai.qwen.base-url=${TINGJIAN_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
tingjian.ai.qwen.model=${TINGJIAN_QWEN_MODEL:qwen-flash}
tingjian.ai.qwen.connect-timeout=2s
tingjian.ai.qwen.read-timeout=3s

# Cloud ASR is opt-in. Android automatically falls back to its system recognizer.
tingjian.speech.asr.provider=${TINGJIAN_ASR_PROVIDER:android}
tingjian.speech.aliyun.api-key=${DASHSCOPE_API_KEY:}
tingjian.speech.aliyun.websocket-url=${TINGJIAN_DASHSCOPE_WS_URL:wss://dashscope.aliyuncs.com/api-ws/v1/inference}
tingjian.speech.aliyun.asr-model=${TINGJIAN_ASR_MODEL:paraformer-realtime-v2}
tingjian.speech.aliyun.max-sentence-silence=${TINGJIAN_ASR_MAX_SILENCE_MS:800}

# Gradual microservice integration. Disabled keeps the monolith independently runnable.
tingjian.microservices.usage.enabled=${TINGJIAN_USAGE_SERVICE_ENABLED:false}
tingjian.microservices.usage.base-url=${TINGJIAN_USAGE_SERVICE_URL:http://127.0.0.1:8093}
tingjian.microservices.usage.connect-timeout=1s
tingjian.microservices.usage.read-timeout=2s
tingjian.microservices.usage.internal-token=${TINGJIAN_INTERNAL_SERVICE_TOKEN:}
# Keep requests available during migration; switch off only after monitoring is ready.
tingjian.microservices.usage.fail-open=${TINGJIAN_USAGE_FAIL_OPEN:true}

# AI/Agent migration. Public authentication remains in the main service; only sanitized,
# user-scoped context is forwarded to ai-speech-service with the internal service token.
tingjian.microservices.ai-speech.enabled=${TINGJIAN_AI_SPEECH_SERVICE_ENABLED:false}
tingjian.microservices.ai-speech.base-url=${TINGJIAN_AI_SPEECH_SERVICE_URL:http://127.0.0.1:8092}
tingjian.microservices.ai-speech.connect-timeout=1s
tingjian.microservices.ai-speech.read-timeout=35s
tingjian.microservices.ai-speech.internal-token=${TINGJIAN_INTERNAL_SERVICE_TOKEN:}
tingjian.insight.provider=${TINGJIAN_INSIGHT_PROVIDER:local}
