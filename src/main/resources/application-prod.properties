tingjian.auth.verification-delivery=webhook
tingjian.auth.verification-pepper=${TINGJIAN_VERIFICATION_PEPPER}
tingjian.auth.verification-webhook-url=${TINGJIAN_VERIFICATION_WEBHOOK_URL}
tingjian.auth.verification-webhook-token=${TINGJIAN_VERIFICATION_WEBHOOK_TOKEN}

# Production traffic must terminate TLS at the application gateway or reverse proxy.
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
