tingjian.auth.verification-delivery=webhook
tingjian.auth.verification-pepper=${TINGJIAN_VERIFICATION_PEPPER}
tingjian.auth.verification-webhook-url=${TINGJIAN_VERIFICATION_WEBHOOK_URL}
tingjian.auth.verification-webhook-token=${TINGJIAN_VERIFICATION_WEBHOOK_TOKEN}

server.port=${TINGJIAN_SERVER_PORT:8080}
spring.datasource.url=${TINGJIAN_DB_URL}
spring.datasource.username=${TINGJIAN_DB_USERNAME:tingjian}
spring.datasource.password=${TINGJIAN_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${TINGJIAN_DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${TINGJIAN_DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=5000
spring.data.redis.host=${TINGJIAN_REDIS_HOST}
spring.data.redis.port=${TINGJIAN_REDIS_PORT:6379}
spring.data.redis.password=${TINGJIAN_REDIS_PASSWORD:}
tingjian.cors.allowed-origin-patterns=${TINGJIAN_CORS_ALLOWED_ORIGINS}

# Production traffic must terminate TLS at the application gateway or reverse proxy.
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoint.health.show-details=never
