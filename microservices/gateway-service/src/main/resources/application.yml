spring:
  application:
    name: tingjian-gateway

server:
  port: ${TINGJIAN_GATEWAY_PORT:8088}

tingjian:
  routes:
    legacy-http: ${TINGJIAN_LEGACY_HTTP_URL:http://127.0.0.1:8080}
    legacy-websocket: ${TINGJIAN_LEGACY_WS_URL:ws://127.0.0.1:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
