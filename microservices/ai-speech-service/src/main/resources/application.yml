spring:
  application:
    name: tingjian-ai-speech

server:
  port: ${TINGJIAN_AI_SPEECH_PORT:8092}
  address: ${TINGJIAN_AI_SPEECH_BIND_ADDRESS:127.0.0.1}

tingjian:
  internal-auth:
    enabled: ${TINGJIAN_INTERNAL_AUTH_ENABLED:false}
    token: ${TINGJIAN_INTERNAL_SERVICE_TOKEN:}
  ai:
    provider: ${TINGJIAN_AI_MODEL_PROVIDER:local}
    qwen:
      api-key: ${TINGJIAN_QWEN_API_KEY:}
      base-url: ${TINGJIAN_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${TINGJIAN_QWEN_MODEL:qwen-plus}
      connect-timeout: ${TINGJIAN_QWEN_CONNECT_TIMEOUT:2s}
      read-timeout: ${TINGJIAN_QWEN_READ_TIMEOUT:20s}
  speech:
    asr:
      api-key: ${TINGJIAN_ASR_API_KEY:${TINGJIAN_QWEN_API_KEY:}}
      model: ${TINGJIAN_ASR_MODEL:paraformer-realtime-v2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
